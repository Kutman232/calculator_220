<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Калькулятор Космического Закона</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --header-bg: #1f242d;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-red: #f85149;
      --accent-green: #3fb950;
      --accent-yellow: #d29922;
      --accent-blue: #58a6ff;
      --btn-danger: #da3633;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .header-logo {
      height: 36px;
      width: 36px;
      object-fit: contain;
      border-radius: 50%;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .header-logo:hover {
      transform: scale(1.1);
      opacity: 0.9;
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--btn-danger);
      color: #f85149;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-reset:hover {
      background-color: var(--btn-danger);
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    h2 { margin-top: 0; color: #fff; font-size: 1.1rem; }
    
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .category-title {
      font-weight: bold;
      padding: 8px 12px;
      background: #21262d;
      border-radius: 6px;
      margin: 15px 0 10px 0;
      border-left: 4px solid var(--accent-blue);
      color: #fff;
    }

    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    <img src="https://i.ibb.co/3k8Xy4Y/SS220-Logo.png" alt="SS220 Logo" class="header-logo">
    .article-item, .modifier-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0d1117;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem;
    }

    .article-item:hover, .modifier-item:hover {
      border-color: var(--accent-blue);
    }

    .badge {
      font-size: 0.8em;
      padding: 2px 6px;
      border-radius: 4px;
      background: #21262d;
      color: #58a6ff;
      font-weight: bold;
      border: 1px solid var(--border-color);
    }

    .result-box {
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .status-badge {
      font-size: 1.1em;
      font-weight: bold;
      text-align: center;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
    }

    .status-normal { background: #122c1b; color: #3fb950; border: 1px solid #238636; }
    .status-permabrig { background: #38280e; color: #f2cc60; border: 1px solid #bb8009; }
    .status-execution { background: #3c1e1e; color: #f85149; border: 1px solid #da3633; }

    .summary-list {
      font-size: 0.9em;
      color: var(--text-muted);
      margin: 10px 0;
      padding-left: 20px;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-title">
    <a href="https://wiki14.ss220.club/wiki/%D0%9A%D0%BE%D1%81%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%97%D0%B0%D0%BA%D0%BE%D0%BD" target="_blank" class="header-logo-link" title="Перейти на Вики SS220">
      <img src="logo.png" alt="SS220 Logo" class="header-logo">
    </a>
    ⚖️ Калькулятор Космического Закона
  </div>
  <button class="btn-reset" onclick="resetAll()">↻ Сбросить всё</button>
</header>

<div class="container">
  <div>
    <div class="card">
      <h2>Статьи обвинения</h2>
      <div id="articles-container"></div>
    </div>

    <div class="card">
      <h2>Модификаторы наказания</h2>
      <div id="modifiers-container" class="article-grid"></div>
    </div>
  </div>

  <div class="result-box">
    <div class="card">
      <h2>Итоговый приговор</h2>
      <div>Выбрано статей: <b id="selected-count">0</b></div>
      
      <ul id="selected-list" class="summary-list"></ul>
      <hr style="border-color: var(--border-color)">
      
      <div>Базовый срок: <b id="raw-time">0</b> мин.</div>
      <div>С учетом совокупности (1.5x max): <b id="capped-time">0</b> мин.</div>
      <div style="font-size: 1.2em; margin-top: 10px;">
        Итоговый срок: <b id="final-time" style="color: var(--accent-blue)">0</b> мин.
      </div>

      <div id="status-box" class="status-badge status-normal">
        Свободен / Предупреждение
      </div>
    </div>
  </div>
</div>

<script>
const articlesData = [
  // 1XX
  { code: "100", name: "Ущерб активам станции", group: "00", time: 5, cat: "1XX — Малозначительные (до 5 мин)" },
  { code: "102", name: "Нанесение побоев", group: "02", time: 5, cat: "1XX — Малозначительные (до 5 мин)" },
  { code: "103", name: "Владение наркотическими средствами", group: "03", time: 5, cat: "1XX — Малозначительные (до 5 мин)" },
  { code: "106", name: "Злоупотребление экипировкой", group: "06", time: 5, cat: "1XX — Малозначительные (до 5 мин)" },
  { code: "108", name: "Проникновение", group: "08", time: 5, cat: "1XX — Малозначительные (до 5 мин)" },
  { code: "109", name: "Сопротивление аресту", group: "09", time: 5, cat: "1XX — Малозначительные (до 5 мин)" },

  // 2XX
  { code: "200", name: "Халатность", group: "00", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "201", name: "Похищение", group: "01", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "202", name: "Нападение", group: "02", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "203", name: "Распространение наркотиков", group: "03", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "204", name: "Незаконное владение оружием", group: "04", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "205", name: "Мошенничество", group: "05", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "206", name: "Злоупотребление конфискатом", group: "06", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "207", name: "Мелкая кража", group: "07", time: 10, cat: "2XX — Средней тяжести (10 мин)" },
  { code: "208", name: "Проникновение со взломом", group: "08", time: 10, cat: "2XX — Средней тяжести (10 мин)" },

  // 3XX
  { code: "300", name: "Саботаж", group: "00", time: 20, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "301", name: "Похищение лица при исполнении", group: "01", time: 20, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "302", name: "Нападение с отягчающими", group: "02", time: 20, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "304", name: "Владение огранич. вооружением", group: "04", time: 15, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "305", name: "Участие в демонстрациях", group: "05", time: 15, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "306", name: "Владение контрабандой", group: "06", time: 15, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "307", name: "Кража", group: "07", time: 15, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "308", name: "Проникновение в огранич. зоны", group: "08", time: 15, cat: "3XX — Тяжкие (15-20 мин)" },
  { code: "309", name: "Нападение на лицо при исполнении", group: "09", time: 20, cat: "3XX — Тяжкие (15-20 мин)" },

  // 4XX
  { code: "400", name: "Крупный саботаж", group: "00", time: 30, cat: "4XX — Особо тяжкие (30 мин)" },
  { code: "401", name: "Непредумышленное убийство", group: "01", time: 30, cat: "4XX — Особо тяжкие (30 мин)" },
  { code: "402", name: "Покушение на убийство", group: "02", time: 30, cat: "4XX — Особо тяжкие (30 мин)" },
  { code: "405", name: "Подстрекательство к демонстрациям", group: "05", time: 30, cat: "4XX — Особо тяжкие (30 мин)" },
  { code: "407", name: "Кража в крупных размерах", group: "07", time: 30, cat: "4XX — Особо тяжкие (30 мин)" },

  // 5XX
  { code: "502", name: "Убийство", group: "02", time: 0, execution: true, cat: "5XX — Высшая мера" },
  { code: "505", name: "Мятеж", group: "05", time: 0, execution: true, cat: "5XX — Высшая мера" }
];

const modifiersData = [
  { id: "cooperation", name: "Сотрудничество (-50%)", mult: 0.5 },
  { id: "surrender", name: "Явка с повинной (-50%)", mult: 0.5 },
  { id: "refusal", name: "Отказ от сотрудничества (+50%)", mult: 1.5 },
  { id: "recidivism_1", name: "Рецидив 1 (+10 мин)", add: 10 },
  { id: "recidivism_2", name: "Рецидив 2 (+20 мин)", add: 20 },
  { id: "recidivism_3", name: "Рецидив 3 (+30 мин)", add: 30 },
  { id: "recidivism_4", name: "Рецидив 4 (+40 мин)", add: 40 },
  { id: "self_defense", name: "Самооборона / Крайняя необх.", clear: true },
  { id: "enemy_conv", name: "Вражеская конвертация", custom: "Освобождение / Деконвертация" }
];

let selectedArticles = new Set();
let selectedModifiers = new Set();

function render() {
  const artContainer = document.getElementById('articles-container');
  artContainer.innerHTML = '';

  const categories = [...new Set(articlesData.map(a => a.cat))];
  categories.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category-title';
    catDiv.innerText = cat;
    artContainer.appendChild(catDiv);

    const grid = document.createElement('div');
    grid.className = 'article-grid';

    articlesData.filter(a => a.cat === cat).forEach(a => {
      const label = document.createElement('label');
      label.className = 'article-item';
      label.innerHTML = `
        <input type="checkbox" value="${a.code}" ${selectedArticles.has(a.code) ? 'checked' : ''}>
        <span class="badge">${a.code}</span>
        <span>${a.name}</span>
      `;
      label.querySelector('input').addEventListener('change', (e) => {
        if (e.target.checked) selectedArticles.add(a.code);
        else selectedArticles.delete(a.code);
        calculate();
      });
      grid.appendChild(label);
    });
    artContainer.appendChild(grid);
  });

  const modContainer = document.getElementById('modifiers-container');
  modContainer.innerHTML = '';
  modifiersData.forEach(m => {
    const label = document.createElement('label');
    label.className = 'modifier-item';
    label.innerHTML = `
      <input type="checkbox" value="${m.id}" ${selectedModifiers.has(m.id) ? 'checked' : ''}>
      <span>${m.name}</span>
    `;
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) selectedModifiers.add(m.id);
      else selectedModifiers.delete(m.id);
      calculate();
    });
    modContainer.appendChild(label);
  });
}

function calculate() {
  const grouped = {};
  selectedArticles.forEach(code => {
    const art = articlesData.find(a => a.code === code);
    if (!grouped[art.group] || art.time > grouped[art.group].time || art.execution) {
      grouped[art.group] = art;
    }
  });

  const activeArticles = Object.values(grouped);
  const activeMods = modifiersData.filter(m => selectedModifiers.has(m.id));

  document.getElementById('selected-count').innerText = selectedArticles.size;
  const listEl = document.getElementById('selected-list');
  listEl.innerHTML = activeArticles.map(a => `<li><b>${a.code}</b> ${a.name} (${a.execution ? 'ВМН' : a.time + 'м'})</li>`).join('');

  let rawSum = 0;
  let maxTime = 0;
  let hasExecution = false;

  activeArticles.forEach(a => {
    if (a.execution) hasExecution = true;
    rawSum += a.time;
    if (a.time > maxTime) maxTime = a.time;
  });

  const capLimit = maxTime * 1.5;
  let totalTime = Math.min(rawSum, capLimit);

  let mult = 1.0;
  let add = 0;
  let isCleared = false;
  let customStatus = null;

  activeMods.forEach(m => {
    if (m.mult) mult *= m.mult;
    if (m.add) add += m.add;
    if (m.clear) isCleared = true;
    if (m.custom) customStatus = m.custom;
  });

  totalTime = Math.round(totalTime * mult) + add;

  document.getElementById('raw-time').innerText = rawSum;
  document.getElementById('capped-time').innerText = capLimit;
  document.getElementById('final-time').innerText = totalTime;

  const statusBox = document.getElementById('status-box');

  if (isCleared) {
    statusBox.className = 'status-badge status-normal';
    statusBox.innerText = 'Снятие всех обвинений';
  } else if (customStatus) {
    statusBox.className = 'status-badge status-permabrig';
    statusBox.innerText = customStatus;
  } else if (hasExecution || totalTime >= 90) {
    statusBox.className = 'status-badge status-execution';
    statusBox.innerText = 'Высшая мера / Казнь / Пермабриг';
  } else if (totalTime >= 60) {
    statusBox.className = 'status-badge status-permabrig';
    statusBox.innerText = 'Пермабриг / Киборгизация';
  } else if (totalTime > 0) {
    statusBox.className = 'status-badge status-normal';
    statusBox.innerText = `Заключение на ${totalTime} мин.`;
  } else {
    statusBox.className = 'status-badge status-normal';
    statusBox.innerText = 'Свободен / Предупреждение';
  }
}

function resetAll() {
  selectedArticles.clear();
  selectedModifiers.clear();
  render();
  calculate();
}

render();
calculate();
</script>

</body>
</html>
